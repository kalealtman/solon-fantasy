<style>
  :root {
    --ground: #F2F0EA;
    --surface: #FFFFFF;
    --surface-2: #EAE7DF;
    --border: #DAD5C9;
    --ink: #1D2225;
    --ink-muted: #5B6168;
    --ink-faint: #8B9096;
    --accent: #A6540F;
    --accent-ink: #7A3D0B;
    --medal-gold: #B8940E;
    --blue: #1F5C91;
    --green: #3D8B5C;
    --red: #8B2F1F;
    --shadow: 0 1px 2px rgba(29,34,37,0.06), 0 4px 12px rgba(29,34,37,0.05);
    --radius: 5px;
    --font-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
    --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14181C;
      --surface: #1E252B;
      --surface-2: #262E35;
      --border: #333D45;
      --ink: #F0EDE6;
      --ink-muted: #9BA3AC;
      --ink-faint: #6B747C;
      --accent: #D9731A;
      --accent-ink: #F0955A;
      --medal-gold: #E8C468;
      --blue: #2E7FBD;
      --green: #57A87A;
      --red: #C2603F;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #14181C;
    --surface: #1E252B;
    --surface-2: #262E35;
    --border: #333D45;
    --ink: #F0EDE6;
    --ink-muted: #9BA3AC;
    --ink-faint: #6B747C;
    --accent: #D9731A;
    --accent-ink: #F0955A;
    --medal-gold: #E8C468;
    --blue: #2E7FBD;
    --green: #57A87A;
    --red: #C2603F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: #14181C; }

  a { color: var(--blue); }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  .site-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px clamp(16px, 4vw, 40px) 0;
  }
  .site-header__top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .site-title-row { display: flex; align-items: center; gap: 14px; }
  .site-title { font-size: clamp(28px, 4vw, 40px); line-height: 1; color: var(--ink); }
  .site-title .accent { color: var(--accent); }
  .site-tagline { color: var(--ink-muted); font-size: 13px; margin-top: 4px; letter-spacing: 0.02em; text-transform: uppercase; }
  .ticker {
    display: flex; gap: clamp(16px, 3vw, 36px); flex-wrap: wrap;
    font-family: var(--font-mono); font-size: 13px; color: var(--ink-muted);
  }
  .ticker b { color: var(--ink); font-weight: 600; }

  .tabs {
    display: flex; gap: 4px; overflow-x: auto; margin-top: 18px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    font-family: var(--font-display); font-weight: 700; font-size: 16px;
    letter-spacing: 0.02em; text-transform: uppercase;
    background: none; border: none; color: var(--ink-muted);
    padding: 10px 16px 12px; cursor: pointer; white-space: nowrap;
    border-bottom: 3px solid transparent;
  }
  .tab:hover { color: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }

  main { max-width: 1180px; margin: 0 auto; padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 40px) 80px; }
  .view { display: none; }
  .view.active { display: block; }

  .grid { display: grid; gap: 16px; }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 900px) { .grid.cols-4 { grid-template-columns: repeat(2, 1fr); } .grid.cols-3 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px) { .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow);
  }
  .card h3 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-muted); margin-bottom: 10px; }
  .section-title {
    font-size: clamp(20px, 3vw, 26px); margin: 36px 0 14px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .section-title:first-child { margin-top: 0; }
  .section-sub { color: var(--ink-muted); font-size: 13px; margin: -8px 0 16px; }

  .stat-tile { text-align: left; }
  .stat-tile .value { font-family: var(--font-mono); font-size: clamp(26px, 4vw, 34px); font-weight: 600; color: var(--ink); line-height: 1.1; }
  .stat-tile .value.accent { color: var(--accent-ink, var(--accent)); }
  .stat-tile .label { color: var(--ink-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 6px; }
  .stat-tile .sub { color: var(--ink-faint); font-size: 12px; margin-top: 2px; }

  .fact-card { border-left: 3px solid var(--accent); }
  .fact-card .fact-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-muted); margin-bottom: 8px; }
  .fact-card .fact-number { font-family: var(--font-mono); font-size: clamp(26px, 3vw, 32px); font-weight: 600; color: var(--ink); line-height: 1.1; }
  .fact-card .fact-name { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: var(--ink); margin-top: 4px; }
  .fact-card .fact-detail { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); margin-top: 3px; }

  .ap-poll-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
  .ap-poll-row { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  .ap-poll-row:last-child { border-bottom: none; }
  .ap-rank { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--ink-muted); width: 38px; flex-shrink: 0; text-align: center; }
  .ap-body { flex: 1; min-width: 0; }
  .ap-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink); }
  .ap-fpv { font-family: var(--font-mono); font-size: 12px; color: var(--accent-ink, var(--accent)); margin-left: 7px; }
  .ap-sub { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .ap-points { font-family: var(--font-mono); font-size: 19px; font-weight: 600; color: var(--ink); text-align: right; flex-shrink: 0; }
  .ap-points-label { font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.03em; margin-left: 3px; }

  .poll-award-card {
    display: flex; flex-direction: column; gap: 10px; border-left: none; overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .poll-award-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.25); }
  .poll-award-card .award-photo {
    align-self: flex-start; width: 76px; height: 76px; border-radius: 10px; overflow: hidden;
    border: 3px solid var(--surface-2); box-shadow: var(--shadow); transform: rotate(-4deg);
    background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 36px;
  }
  .poll-award-card .award-photo img { width: 100%; height: 100%; object-fit: cover; }
  .poll-award-card .award-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); }
  .poll-award-card .award-name { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--ink); line-height: 1.25; }
  .poll-award-card .award-subtitle { display: block; font-size: 12px; font-weight: 500; color: var(--ink-muted); margin-top: 1px; }
  .poll-award-card .award-desc { font-size: 12.5px; color: var(--ink-muted); line-height: 1.5; }
  .poll-award-card .award-winner-row { margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--border); }
  .poll-award-card .award-winner-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); display: block; margin-bottom: 2px; }
  .poll-award-card .award-winner { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--accent-ink, var(--accent)); line-height: 1.15; }
  .poll-award-card .award-votes { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); margin-top: 4px; }

  .record-columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 820px) { .record-columns { grid-template-columns: 1fr; } }
  .record-column-title {
    font-family: var(--font-display); font-size: 18px; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--ink-muted); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border);
  }
  .record-column .fact-card { margin-bottom: 14px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  th, td { padding: 9px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
  thead th {
    font-family: var(--font-body); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--ink-muted); font-weight: 600; cursor: pointer; user-select: none;
    position: sticky; top: 0; background: var(--surface-2);
  }
  thead th:hover { color: var(--ink); }
  thead th .arrow { opacity: 0.4; font-size: 10px; margin-left: 3px; }
  .team-owner { font-size: 11px; color: var(--ink-faint); font-weight: 400; margin-top: 1px; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: none; }

  /* Owner name stays put while the rest of the All-Time table scrolls
     sideways -- most useful on a phone, where all those stat columns
     never fit at once. */
  #career-table th:first-child, #career-table td:first-child {
    position: sticky; left: 0; background: var(--surface); box-shadow: 1px 0 0 var(--border);
  }
  #career-table thead th:first-child { z-index: 2; background: var(--surface-2); }
  #career-table tbody td:first-child { z-index: 1; }
  #career-table tbody tr:hover td:first-child { background: var(--surface-2); }
  td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%; font-family: var(--font-mono); font-size: 12px; font-weight: 600;
    background: var(--surface-2); color: var(--ink-muted);
  }
  .rank-badge.medal { background: var(--medal-gold); color: #14181C; }
  .rank-badge.silver { background: #C0C4C8; color: #14181C; }
  .rank-badge.bronze { background: #B0793A; color: #FBF7F0; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  select, .btn {
    font-family: var(--font-body); font-size: 13.5px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 12px; cursor: pointer;
  }
  select:focus-visible, .btn:focus-visible, .tab:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  label.field-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-muted); margin-right: 6px; }

  .h2h-picker { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
  .h2h-vs { font-family: var(--font-display); font-size: 20px; color: var(--ink-faint); }
  .h2h-card { max-width: 480px; margin: 0 auto; text-align: center; }
  .h2h-result { display: flex; justify-content: center; align-items: center; gap: 32px; }
  .h2h-score { font-family: var(--font-mono); font-size: 48px; font-weight: 600; line-height: 1; }
  .h2h-name { font-size: 13px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 6px; }
  .h2h-meta { color: var(--ink-faint); font-size: 12px; margin-top: 14px; }
  .h2h-games-title { text-align: center; }

  .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar-label {
    width: 150px; flex-shrink: 0; font-size: 13px; text-align: right; color: var(--ink-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default;
  }
  .bar-track { flex: 1; background: var(--surface-2); border-radius: 3px; height: 20px; position: relative; }
  .bar-fill { background: var(--blue); height: 100%; border-radius: 3px; display: flex; align-items: center; min-width: 2px; }
  .bar-value { font-family: var(--font-mono); font-size: 12px; color: var(--ink); padding-left: 8px; white-space: nowrap; }
  .bar-value.outside { color: var(--ink-muted); padding-left: 0; margin-left: 8px; }

  .owner-hover { cursor: default; border-bottom: 1px dotted var(--ink-faint); }
  .owner-tooltip {
    position: fixed; z-index: 50; pointer-events: none; opacity: 0; transform: translateY(4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px 14px; font-size: 12.5px; min-width: 190px;
  }
  .owner-tooltip.visible { opacity: 1; transform: translateY(0); }
  .owner-tooltip .ot-name { font-family: var(--font-display); font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .owner-tooltip .ot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
  .owner-tooltip .ot-stat { display: flex; justify-content: space-between; gap: 8px; }
  .owner-tooltip .ot-stat .ot-label { color: var(--ink-muted); }
  .owner-tooltip .ot-stat .ot-val { font-family: var(--font-mono); color: var(--ink); }
  .owner-tooltip .ot-drafted { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--border); color: var(--ink-muted); }
  .owner-tooltip .ot-drafted-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 3px; }
  .owner-tooltip .ot-drafted b { color: var(--ink); font-weight: 600; }

  .draft-round { margin-bottom: 4px; }
  .draft-round-label { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); text-transform: uppercase; margin: 14px 0 6px; }
  /* Grid with a per-row column count (--cols, set inline per round) instead
     of a fixed card width -- cards shrink to fit the row exactly rather
     than overflowing into a horizontal scrollbar for a 10-team league. */
  .draft-board { display: grid; grid-template-columns: repeat(var(--cols, 10), minmax(0, 1fr)); gap: 5px; margin-bottom: 6px; }
  .draft-board-pick {
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); text-align: center;
    margin-bottom: 4px; letter-spacing: 0.02em;
  }
  .draft-board-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 8px 4px; text-align: center;
  }
  .draft-board-name { font-size: 11.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .draft-board-owner { font-size: 10px; color: var(--ink-muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Ten squeezed grid columns stop being readable well before typical phone
     widths, so below that a round becomes a plain vertical list instead of
     truncating every name to two letters. */
  @media (max-width: 700px) {
    .draft-board { grid-template-columns: 1fr; gap: 6px; }
    .draft-board-slot { display: flex; align-items: center; gap: 12px; }
    .draft-board-pick { margin-bottom: 0; width: 34px; flex-shrink: 0; }
    .draft-board-card { flex: 1; display: flex; align-items: baseline; gap: 8px; text-align: left; padding: 8px 12px; min-width: 0; }
    .draft-board-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .draft-board-owner { flex: 0 0 auto; margin-top: 0; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }

  .txn-row { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; align-items: baseline; flex-wrap: wrap; }
  .txn-row:last-child { border-bottom: none; }
  .txn-icon { font-family: var(--font-mono); font-weight: 700; width: 16px; flex-shrink: 0; }
  .txn-icon.add { color: var(--green); }
  .txn-icon.drop { color: var(--red); }
  .txn-icon.trade { color: var(--blue); }
  .txn-player { font-weight: 600; }
  .txn-meta { color: var(--ink-faint); font-size: 12px; margin-left: auto; font-family: var(--font-mono); white-space: nowrap; }
  .txn-team { color: var(--ink-muted); text-align: right; }
  .txn-team .team-owner { margin-top: 0; }
  .txn-event-players { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .txn-event-players span.txn-icon { margin-right: 2px; }
  .txn-trade-row { align-items: flex-start; }
  .txn-trade-body { display: flex; flex-direction: column; gap: 3px; }
  .txn-trade-body b { color: var(--ink); }

  .champ-callout { display: flex; align-items: center; gap: 18px; background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%); }
  .champ-callout .trophy { font-size: 40px; line-height: 1; }
  .champ-callout .name { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
  .champ-callout .record { font-family: var(--font-mono); color: var(--ink-muted); font-size: 13px; margin-top: 2px; }

  footer { text-align: center; color: var(--ink-faint); font-size: 12px; padding: 30px 20px 50px; }

  @media (prefers-reduced-motion: no-preference) {
    .view.active { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  }
</style>
